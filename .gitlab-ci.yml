# GitLab CI — resiliencx（特性 034：中央模板接入）
# fmt/clippy/test/doc 由 xhyperium/workspace 模板 governance-v1.0.1 提供；
# 其余 job 保留本仓自有定义。模板版本 pin tag，升级走 MR 改 ref。
include:
  - project: "xhyperium/workspace"
    ref: "governance-v1.0.4"
    file:
      - "/.gitlab/ci/templates/governance.yml"
      - "/.gitlab/ci/templates/rust.yml"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"'

variables:
  CARGO_TERM_COLOR: always
  MSRV: "1.77"

.rust:
  image: rust:1.88
  tags: [docker]
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/

supply-chain:
  extends: .rust
  stage: test
  script:
    - cargo install cargo-deny --locked
    - cargo deny check

msrv:
  extends: .rust
  stage: test
  script:
    - if [ "$MSRV" != "1.88" ]; then rustup toolchain install "$MSRV" --profile minimal; fi
    - cargo +"$MSRV" check --all-features

resiliencx-prod-live:
  extends: .rust
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG)'
  script:
    - curl -fsSLO https://nodejs.org/dist/v22.23.5/node-v22.23.5-linux-x64.tar.xz
    - tar -xJf node-v22.23.5-linux-x64.tar.xz -C /usr/local --strip-components=1
    - rm -f node-v22.23.5-linux-x64.tar.xz
    - cargo test --all-features
    - cargo test --test e2e_resilienc -- --include-ignored --test-threads=1
    - node scripts/emit-e1-receipt.mjs --out e1-receipt.json
  artifacts:
    when: always
    paths:
      - e1-receipt.json
    expire_in: 90 days
