name: CI

# 组织 Rust 规范的 P0 门禁三件套（见仓库 AGENTS.md）：
#   cargo fmt --check / cargo clippy --all-targets -- -D warnings / cargo test
#
# 与第一轮适配器仓库的 ci.yml 的差异：
# 1. 本仓库依赖尚未发布到 crates.io 的 `instrumentationx`，Cargo.toml 中以
#    `path = "../instrumentationx"` 声明。CI 必须把该仓库 checkout 到同一相对位置，
#    依赖才能解析。
#    前置条件：`bytechainx/instrumentationx` 的 PR #1 必须先合并（其 `main` 目前为空，
#    内容暂在其 `feature/initial-migration` 分支上）。在此之前本 workflow 会因
#    依赖解析失败而红，这是预期行为，不是本仓库的缺陷。
# 2. 本仓库有可选 feature `tokio`（`TokioSleepWait` / `retry_async_with_deadline`
#    在该 feature 下才参与编译），因此 clippy 与 test 均加 `--all-features`，
#    否则 feature-gated 代码不会被 CI 覆盖。
# 3. 新增 `cargo deny` 供应链作业与 `msrv` 作业（组织基线 R-SEC-007 / R-DEP-005）。
#
# 其余约定与第一轮一致：
# - 使用 `--locked` 的等价语义：本仓库已入库 `Cargo.lock`（组织基线 R-SEC-009 /
#   R-DEP-005：供应链可重现），CI 按锁文件解析依赖。
# - `cargo test` 同时运行单元测试、集成测试与文档测试（doctest）。
# - 不依赖任何外部服务：全部用例离线运行。
# - 不设全局 `RUSTFLAGS`：`-D warnings` 只由 clippy 那一行的 `--` 参数表达，
#   避免影响依赖构建且保持与本地门禁逐字一致。

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - name: checkout 本仓库
        uses: actions/checkout@v4
        with:
          path: app

      - name: checkout 依赖 instrumentationx
        uses: actions/checkout@v4
        with:
          repository: bytechainx/instrumentationx
          path: instrumentationx

      - name: 安装 Rust 工具链（含 rustfmt 与 clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: cargo fmt --check
        working-directory: app
        run: cargo fmt --check

      - name: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: app
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test --all-features
        working-directory: app
        run: cargo test --all-features

  supply-chain:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: checkout 依赖 instrumentationx
        uses: actions/checkout@v4
        with:
          repository: bytechainx/instrumentationx
          path: instrumentationx

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: app/Cargo.toml


  msrv:
    name: msrv 1.77
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: checkout 依赖 instrumentationx
        uses: actions/checkout@v4
        with:
          repository: bytechainx/instrumentationx
          path: instrumentationx

      - name: 安装 MSRV 工具链
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.77"

      - uses: Swatinem/rust-cache@v2

      - name: cargo check（按声明的 rust-version）
        working-directory: app
        run: cargo check --all-features

  # E1 生产收据：仅在 main / tag 上运行，绑定 pipeline/job/commit 生成收据工件。
  # 对齐 Spec Pipeline r2 DP-2 处置方案与 STATUS.md C2/C4 登记；本仓无外部真服务，
  # E1 口径 = CI 内全量测试（含 e2e）绿后由 CI 环境变量签发的 provenance 收据，
  # 不是 live 服务探活。收据为工件，不入库；闭合回写由规格根侧另行登记。
  resiliencx-prod-live:
    name: resiliencx-prod-live (E1 receipt)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: checkout 本仓库
        uses: actions/checkout@v4
        with:
          path: app

      - name: checkout 依赖 instrumentationx
        uses: actions/checkout@v4
        with:
          repository: bytechainx/instrumentationx
          path: instrumentationx

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: cargo test --all-features
        working-directory: app
        run: cargo test --all-features

      - name: e2e（含忽略项，单线程）
        working-directory: app
        run: cargo test --test e2e_resilienc -- --include-ignored --test-threads=1

      - name: 生成 E1 收据
        working-directory: app
        run: node scripts/emit-e1-receipt.mjs --out e1-receipt.json

      - name: 上传 E1 收据工件
        uses: actions/upload-artifact@v4
        with:
          name: e1-receipt
          path: app/e1-receipt.json
          retention-days: 90
